[package]
name = "runaware"
version = "0.1.7"
edition = "2024"
description = "Local runtime awareness for AI coding agents"
license = "MIT"
repository = "https://github.com/ganeshpatro321/runaware"
homepage = "https://github.com/ganeshpatro321/runaware"
readme = "README.md"
keywords = ["ai", "mcp", "debugging", "logs", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]
authors = ["Ganesh Patro <ganeshpatro321@gmail.com>"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.0"
dirs = "6.0.0"
libc = "0.2.186"
portable-pty = "0.9.0"
regex = "1.12.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
